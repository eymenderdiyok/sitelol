<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Lua Scripts</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0d1117,#161b22,#0d1117);
    padding:20px;
}

body::before{
    content:"";
    position:fixed;
    width:700px;
    height:700px;
    background:#00ffae20;
    border-radius:50%;
    filter:blur(140px);
    top:10%;
    left:5%;
}

.card{
    position:relative;
    z-index:2;
    width:720px;
    max-width:100%;
    padding:36px;
    text-align:center;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:18px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.logo{
    font-size:72px;
}

h1{
    color:white;
    margin-top:12px;
    font-size:36px;
}

p{
    color:#b5b5b5;
    margin-top:8px;
    margin-bottom:20px;
}

#startBtn{
    width:220px;
    padding:14px 18px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:18px;
    font-weight:700;
    color:white;
    background:linear-gradient(90deg,#00d084,#00ffae);
    transition:.18s;
    margin-top:8px;
}

#startBtn:hover{ transform:translateY(-3px); }

.options{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:18px;
}

.option{
    display:flex;
    align-items:center;
    justify-content:center;
    height:96px;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.05);
    color:#eaeaea;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    transition:.16s;
    text-align:center;
}

.option:hover{ transform:scale(1.02); box-shadow:0 10px 30px rgba(0,0,0,0.45); }

.option.selected{
    background:linear-gradient(90deg,#00d084,#00ffae);
    color:#071212;
    box-shadow:0 12px 30px rgba(0,255,174,0.16);
}

textarea{
    width:100%;
    min-height:160px;
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    resize:vertical;
    border:1px solid rgba(255,255,255,0.06);
    background:rgba(0,0,0,0.3);
    color:#fff;
    font-family:'Poppins',sans-serif;
    font-size:14px;
}

.footer{
    margin-top:16px;
    color:#999;
    font-size:13px;
}

.note{
    margin-top:8px;
    color:#bdbdbd;
    font-size:13px;
}

@media (max-width:520px){
    .option{ height:78px; font-size:18px; }
    textarea{ min-height:120px; }
}
</style>

</head>
<body>

<div class="card" id="card">
  <div class="logo">🎮</div>
  <h1>Roblox Delta Scripts</h1>
  <p>Choose a game and paste your script below.</p>

  <button id="startBtn">Start</button>

  <div class="footer">© 2026 Roblox Delta Scripts</div>
</div>

<script>
const card = document.getElementById('card');
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', showOptions);

function showOptions(){
  card.innerHTML = `
    <div class="logo">🎮</div>
    <h1>Choose a Game</h1>
    <p class="note">Tap a game below to select it. Paste your script in the box — for now it contains "Coming soon".</p>

    <div class="options">
      <div class="option" id="mm2">Murder Mystery 2</div>
      <div class="option" id="adopt">Adopt Me!</div>
    </div>

    <textarea id="scriptBox">Coming soon</textarea>

    <div class="footer">© 2026 Roblox Delta Scripts</div>
  `;

  // after injecting HTML, wire up interactions
  const mm2 = document.getElementById('mm2');
  const adopt = document.getElementById('adopt');
  const textarea = document.getElementById('scriptBox');

  [mm2, adopt].forEach(el => {
    el.addEventListener('click', () => {
      // visually select
      mm2.classList.remove('selected');
      adopt.classList.remove('selected');
      el.classList.add('selected');
      // focus the textarea so the user can paste
      textarea.focus();
      // place caret at end
      const val = textarea.value;
      textarea.value = '';
      textarea.value = val;
    });
  });
}
</script>

</body>
</html>

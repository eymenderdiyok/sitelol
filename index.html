<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Lua Scripts</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0d1117,#161b22,#0d1117);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:#00ffae20;
    border-radius:50%;
    filter:blur(120px);
}

.card{
    position:relative;
    z-index:2;
    width:420px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
    font-size:60px;
}

h1{
    color:white;
    margin-top:15px;
    font-size:34px;
}

p{
    color:#b5b5b5;
    margin-top:10px;
    margin-bottom:30px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#00d084,#00ffae);
    transition:.25s;
}

button:hover{
    transform:scale(1.04);
    box-shadow:0 10px 30px rgba(0,255,174,.35);
}

.footer{
    margin-top:25px;
    color:#777;
    font-size:13px;
}

/* New styles for games */
.games{
    display:flex;
    gap:12px;
    flex-direction:column;
    align-items:stretch;
    margin-top:18px;
}

.game{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    background:rgba(255,255,255,0.02);
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.04);
    color:#eaeaea;
}

.game .name{
    text-align:left;
}

.small-btn{
    padding:8px 12px;
    border-radius:10px;
    background:linear-gradient(90deg,#0077ff,#00d084);
    color:white;
    border:none;
    cursor:pointer;
}

.copy-row{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.copy-row input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.06);
    background:transparent;
    color:#fff;
}

.copy-row button{
    flex:0 0 auto;
    padding:12px 14px;
    border-radius:10px;
}

.copy-row input:focus{
    outline:none;
    box-shadow:0 6px 20px rgba(0,210,140,0.12);
}

</style>

</head>
<body>

<div class="card" id="card">

<div class="logo">🎮</div>

<h1>Roblox Delta Scripts</h1>

<p>Discover modern Roblox Lua resources and script collections.</p>

<button id="startBtn">Start</button>

<div class="footer">
© 2026 Roblox Delta Scripts
</div>

</div>

<script>
const card = document.getElementById('card');
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', showGames);

function showGames(){
  card.innerHTML = `
    <div class="logo">🎮</div>
    <h1>Choose a Game</h1>
    <p>Select one of the games below.</p>

    <div class="games">
      <div class="game">
        <div class="name">
          <div style="font-weight:700">Murder Mystery 2</div>
          <div style="font-size:12px;color:#bdbdbd">A classic Roblox detective game</div>
        </div>
        <div>
          <button class="small-btn" onclick="openGame('https://www.roblox.com/games/142823291')">Play</button>
        </div>
      </div>

      <div class="game">
        <div class="name">
          <div style="font-weight:700">Adopt Me!</div>
          <div style="font-size:12px;color:#bdbdbd">Popular roleplay & trading</div>
        </div>
        <div>
          <button class="small-btn" onclick="openGame('https://www.roblox.com/games/920587237')">Play</button>
        </div>
      </div>
    </div>

    <div class="copy-row">
      <input id="comingText" value="Coming Soon" readonly onclick="this.select()" />
      <button id="copyBtn" class="small-btn">Copy</button>
    </div>

    <div class="footer">© 2026 Roblox Delta Scripts</div>
  `;

  // attach copy handler after replacing innerHTML
  document.getElementById('copyBtn').addEventListener('click', () => {
    const input = document.getElementById('comingText');
    input.select();
    input.setSelectionRange(0, 99999); // for mobile
    try {
      navigator.clipboard.writeText(input.value).then(() => {
        const btn = document.getElementById('copyBtn');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = original, 1200);
      }).catch(() => {
        document.execCommand('copy');
        alert('Copied to clipboard');
      });
    } catch (e) {
      // fallback for older browsers
      document.execCommand('copy');
      alert('Copied to clipboard');
    }
  });
}

function openGame(url){
  // open in a new tab
  window.open(url, '_blank');
}
</script>

</body>
</html>
